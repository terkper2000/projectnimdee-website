[build]
  command = "pnpm --filter @workspace/project-nimdee run build"
  publish = "artifacts/project-nimdee/dist/public"

[build.environment]
  NODE_VERSION  = "22"
  PNPM_VERSION  = "10"
  PORT          = "3000"
  BASE_PATH     = "/"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
